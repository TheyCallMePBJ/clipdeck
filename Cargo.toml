[package]
name = "clipdeck"
version = "0.1.0"
edition = "2024"
description = "Terminal-styled clipboard history manager for Wayland, built on cliphist"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
notify = "9.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
